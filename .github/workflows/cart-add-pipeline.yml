name: Pipeline for Cart Add Microservice

on:
  push:
    branches:
      - test
    paths:
      - 'add-service/**'
      - '.github/workflows/cart-add-pipeline.yml'
  pull_request:
    branches: 
      - test
    paths:
      - 'add-service/**'
      - '.github/workflows/cart-add-pipeline.yml'

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker buildx build -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_ADD }}:latest ./add-service

      - name: Push Docker image to Dockerhub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_ADD }}:latest

  deploy-to-ec2-instance:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST_TEST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            echo "Pull, stop, and redeploy the Docker container"
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_ADD }}:latest
            docker stop ${{ secrets.DOCKER_IMAGE_ADD }} || true
            docker rm ${{ secrets.DOCKER_IMAGE_ADD }} || true
            docker run --restart always -e PORT=${{ secrets.CART_ADD_PORT }} \
                       -e REDIS_HOST=${{ secrets.REDIS_HOST }} \
                       -e REDIS_PORT=${{ secrets.REDIS_PORT }} \
                       -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
                       -e NODE_ENV=${{ secrets.NODE_ENV }} \
                       -d --name ${{ secrets.DOCKER_IMAGE_ADD }} \
                       -p 3001:3001 ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_ADD }}:latest
